[project]
name = "forest_fire"
version = "0.1.0"
description = "Tutorial: map forest fires with NASA FIRMS fire alerts"
authors = [
    {name = "Ramadhan", email = "ramadhan@space4good.com"}
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "geopandas",
    "pandas",
    "pyogrio",
    "python-dotenv",
]

[project.optional-dependencies]
# Packages of the notebook
notebook = [
    "contextily",
    "jupyterlab",
    "matplotlib",
    "rasterio",
    # Distance to the fire alerts for the fire risk index
    "scipy",
]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forest_fire"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
